<div class="scroll-progress" [style.width.%]="scrollProgress" aria-hidden="true"></div>

<div class="space-sky" aria-hidden="true">
  <div class="nebula nebula-a"></div>
  <div class="nebula nebula-b"></div>
  <div class="nebula nebula-c"></div>
  <div class="stars stars-near"></div>
  <div class="stars stars-mid"></div>
  <div class="stars stars-far"></div>
  <span class="shooting-star s1"></span>
  <span class="shooting-star s2"></span>
  <span class="shooting-star s3"></span>
</div>

<!-- Subtle professional helicopter flyover -->
<div class="heli-layer" aria-hidden="true">
  <div class="pro-heli">
    <svg class="heli-svg" viewBox="0 0 220 110" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="heliBody" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3a4554"/>
          <stop offset="45%" stop-color="#1e2632"/>
          <stop offset="100%" stop-color="#121820"/>
        </linearGradient>
        <linearGradient id="heliGlass" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#9fdcf0"/>
          <stop offset="100%" stop-color="#3a8fad"/>
        </linearGradient>
        <linearGradient id="heliAccent" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#4fd1ff"/>
          <stop offset="100%" stop-color="#2bb8e0"/>
        </linearGradient>
      </defs>

      <!-- Main rotor disc (spinning) -->
      <g transform="translate(95 28)">
        <g class="main-rotor">
          <ellipse class="rotor-blur" cx="0" cy="0" rx="72" ry="3.5" fill="rgba(180,220,240,0.35)"/>
          <rect x="-70" y="-1.4" width="140" height="2.8" rx="1.4" fill="#c8d8e4"/>
          <rect x="-1.4" y="-70" width="2.8" height="140" rx="1.4" fill="#a8c0d0"/>
          <circle cx="0" cy="0" r="4.5" fill="#d8e4ee"/>
          <circle cx="0" cy="0" r="2.2" fill="#4fd1ff"/>
        </g>
      </g>

      <!-- Mast -->
      <rect x="92" y="28" width="5" height="14" rx="1.5" fill="#6a7584"/>

      <!-- Tail boom -->
      <path d="M118 58 C145 54, 175 50, 198 48 L198 54 C170 58, 145 64, 120 66 Z" fill="url(#heliBody)"/>
      <rect x="128" y="56" width="58" height="2.2" rx="1" fill="url(#heliAccent)" opacity="0.85"/>

      <!-- Tail fin -->
      <path d="M192 34 L204 34 L200 52 L192 52 Z" fill="#2a3442"/>
      <path d="M194 36 L202 36 L199 48 L194 48 Z" fill="#4fd1ff" opacity="0.55"/>

      <!-- Tail rotor -->
      <g transform="translate(200 42)">
        <g class="tail-rotor">
          <ellipse class="rotor-blur" cx="0" cy="0" rx="2" ry="12" fill="rgba(180,220,240,0.4)"/>
          <rect x="-1" y="-11" width="2" height="22" rx="1" fill="#b8c8d4"/>
          <circle cx="0" cy="0" r="2" fill="#8a96a4"/>
        </g>
      </g>

      <!-- Fuselage -->
      <path d="M48 48
               C58 36, 78 32, 98 34
               C118 36, 126 46, 124 60
               C122 74, 108 82, 88 82
               C68 82, 50 74, 44 64
               C40 56, 42 50, 48 48 Z" fill="url(#heliBody)"/>

      <!-- Accent stripe -->
      <path d="M52 62 C70 58, 96 56, 118 58 L116 63 C94 61, 70 63, 54 66 Z" fill="url(#heliAccent)" opacity="0.9"/>

      <!-- Cockpit glass -->
      <path d="M54 50 C62 40, 78 38, 92 40 C88 52, 78 58, 64 58 C58 58, 54 54, 54 50 Z" fill="url(#heliGlass)" opacity="0.92"/>
      <path d="M58 46 C66 42, 78 41, 88 43" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Landing skids -->
      <path d="M58 86 Q88 92 118 86" fill="none" stroke="#7a8694" stroke-width="3" stroke-linecap="round"/>
      <path d="M70 80 L68 88 M102 80 L104 88" stroke="#6a7584" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<div class="cursor-trail" aria-hidden="true">
  <span
    class="trail-dot"
    *ngFor="let dot of trailDots"
    [style.left.px]="dot.x"
    [style.top.px]="dot.y"></span>
</div>
