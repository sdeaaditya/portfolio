<div class="scroll-progress" [style.width.%]="scrollProgress" aria-hidden="true"></div>

<div class="space-sky" aria-hidden="true">
  <div class="nebula nebula-a"></div>
  <div class="nebula nebula-b"></div>
  <div class="nebula nebula-c"></div>
  <div class="stars stars-near"></div>
  <div class="stars stars-mid"></div>
  <div class="stars stars-far"></div>
  <span class="shooting-star s1"></span>
  <span class="shooting-star s2"></span>
  <span class="shooting-star s3"></span>

  <div class="vintage-heli" title="Vintage helicopter">
    <svg viewBox="0 0 180 70" xmlns="http://www.w3.org/2000/svg">
      <ellipse class="rotor" cx="78" cy="10" rx="54" ry="3" />
      <rect x="74" y="12" width="4" height="8" rx="1" fill="#c9d2e3"/>
      <path d="M40 36c0-10 12-18 34-18h22c14 0 24 6 28 14l10 2c8 1 14 6 14 12v4H38v-4c0-4 1-8 2-10z" fill="#8b7355"/>
      <path d="M48 30h40c6 0 10 3 10 7v5H48v-12z" fill="#a89070"/>
      <circle cx="68" cy="34" r="6" fill="#4fd1ff" opacity="0.55"/>
      <circle cx="84" cy="34" r="6" fill="#4fd1ff" opacity="0.35"/>
      <path d="M36 40h-18c-2 0-3 1-3 3v2h21v-5z" fill="#6e5843"/>
      <rect x="128" y="28" width="4" height="18" fill="#c9d2e3"/>
      <ellipse class="tail-rotor" cx="148" cy="30" rx="3" ry="10"/>
      <circle cx="58" cy="52" r="7" fill="#2b2b2b"/>
      <circle cx="58" cy="52" r="3" fill="#777"/>
      <circle cx="96" cy="52" r="7" fill="#2b2b2b"/>
      <circle cx="96" cy="52" r="3" fill="#777"/>
      <path d="M58 45v7M96 45v7" stroke="#c9d2e3" stroke-width="2"/>
    </svg>
  </div>
</div>

<div class="cursor-trail" aria-hidden="true">
  <span
    class="trail-dot"
    *ngFor="let dot of trailDots"
    [style.left.px]="dot.x"
    [style.top.px]="dot.y"></span>
</div>

<!-- Header/Navbar -->
<app-header></app-header>

<!-- Main Content -->
<main class="portfolio-container">
  <!-- Hero Section -->
  <app-hero></app-hero>
  
  <!-- Education Section -->
  <app-education></app-education>
  
  <!-- Projects Section -->
  <app-projects></app-projects>
  
  <!-- Experience Section -->
  <app-experience></app-experience>

  <!-- Alchemist Mini Demo (kept in codebase, hidden from build/UI)
  <app-alchemist-demo></app-alchemist-demo>
  -->
  
  <!-- Tech Stack Section -->
  <app-tech-stack></app-tech-stack>
  
  <!-- Contact Section -->
  <app-contact></app-contact>
</main>

<!-- Footer -->
<app-footer></app-footer>
